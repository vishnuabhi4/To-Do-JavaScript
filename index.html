<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A responsive and interactive to-do list app built with HTML, CSS, Bootstrap, and JavaScript. Easily manage your daily tasks, mark them as complete, and delete them.">
    <meta name="keywords" content="to-do list, task manager, HTML, CSS, Bootstrap, JavaScript, productivity, responsive app">
    <meta name="author" content="Vishnu V">
    <!-- CDN link first -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <!-- Custom CSS second -->
    <link rel="stylesheet" href="CSS/style.css">
    <title>To-Do List Javascript</title>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h1 class="text-center mb-0">To-Do List</h1>
            </div>
            <div class="card-body">
                <div class="input-group mb-3">
                    <input type="text" id="taskInput" class="form-control todo-input" placeholder="Add a new task...">
                    <button id="addTaskBtn" class="btn btn-success">Add Task</button>
                </div>
                
                <ul id="taskList" class="list-group">
                    <!-- Tasks will be added here dynamically -->
                </ul>
                
                <div id="emptyList" class="empty-list">
                    <p>Your to-do list is empty. Add some tasks!</p>
                </div>
            </div>
            <div class="card-footer text-center">
                <button id="clearCompletedBtn" class="btn btn-outline-secondary">Clear Completed</button>
                <button id="clearAllBtn" class="btn btn-outline-danger">Clear All</button>
            </div>
        </div>
    </div>

    <script src="JS/script.js"></script>
</body>
</html>
